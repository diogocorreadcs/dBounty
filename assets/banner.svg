<svg xmlns="http://w3.org" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="296" rx="14" fill="none" stroke="#30363d" stroke-width="2"/>

  <circle cx="220" cy="150" r="64" fill="none" stroke="url(#accent-grad)" stroke-width="4" opacity="0.9"/>
  <circle cx="220" cy="150" r="44" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 6" opacity="0.6"/>
  <circle cx="220" cy="150" r="10" fill="#ef4444"/>
  <line x1="220" y1="70" x2="220" y2="105" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="195" x2="220" y2="230" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="140" y1="150" x2="175" y2="150" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="265" y1="150" x2="300" y2="150" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>

  <text x="340" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">
    d<tspan fill="url(#accent-grad)">Bounty</tspan>
  </text>

  <text x="344" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8b949e" letter-spacing="0.5">
    Sistema Modular de Recompensas por Cabeça • Spigot 1.8.8
  </text>

  <rect x="344" y="218" width="180" height="4" rx="2" fill="url(#accent-grad)"/>
</svg>
