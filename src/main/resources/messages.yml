prefix: "&6&ldBOUNTY &8» &r"

general:
  no-permission: "{prefix}&cVocê não tem permissão para executar este comando."
  only-players: "{prefix}&cEste comando só pode ser executado por jogadores."
  player-not-found: "{prefix}&cJogador &f{target} &cnão encontrado ou nunca entrou no servidor."
  invalid-amount: "{prefix}&cPor favor, digite um valor numérico válido."
  reloaded: "{prefix}&aConfigurações e mensagens recarregadas com sucesso!"

help:
