    - ""
    - "&6&lSISTEMA DE RECOMPENSAS - AJUDA"
    - "&e/bounty &8- &7Abre o menu de jogadores procurados."
    - "&e/bounty colocar <jogador> <valor> &8- &7Coloca uma recompensa."
    - "&e/bounty ver <jogador> &8- &7Consulta o valor de um jogador."
    - "&e/bounty top &8- &7Abre o ranking dos maiores caçadores."
