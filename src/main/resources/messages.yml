  same-clan-bounty: "{prefix}&cVocê não pode colocar uma recompensa em um membro do seu próprio clã."
  blocked-region: "{prefix}&cVocê não pode colocar recompensas estando nesta região protegida."
  placed-success: "{prefix}&aVocê colocou uma recompensa de &f{amount} &ana cabeça de &f{target} &7(Taxa: {tax_amount})&a."
  stacked-success: "{prefix}&aVocê adicionou &f{amount} &aà recompensa de &f{target}&a! Novo total: &f{total}&a."
  placed-broadcast:
    - ""
    - "{prefix}&eO jogador &f{sender} &ecolocou uma recompensa de &a{amount} &epela cabeça de &c{target}&e!"
    - "&7Total acumulado: &a{total} &8| &7Use &f/bounty &7para caçá-lo!"
    - ""
  check-has: "{prefix}&eA cabeça de &f{target} &evale atualmente &a{amount}&e!"
  check-none: "{prefix}&7O jogador &f{target} &7não possui nenhuma recompensa ativa."
  removed-admin: "{prefix}&aVocê removeu a recompensa ativa de &f{target}&a."
  none-to-remove: "{prefix}&cO jogador &f{target} &cnão possui nenhuma recompensa para ser removida."

claim:
