  broadcast:
    - ""
    - "{prefix}&c{killer} &eexecutou &c{target} &ee resgatou a recompensa de &a{amount}&e!"
    - ""
  blocked-contributor: "{prefix}&cVocê contribuiu com essa recompensa, portanto não pode resgatá-la."
  blocked-same-ip: "{prefix}&cResgate bloqueado: ambos os jogadores possuem o mesmo endereço IP."
  blocked-same-clan: "{prefix}&cResgate bloqueado: você não pode resgatar recompensas de membros do seu clã."
  blocked-region: "{prefix}&cResgate bloqueado: não é permitido resgatar recompensas nesta região."
  blocked-cooldown: "{prefix}&cVocê precisa aguardar &f{time}s &cpara resgatar esta recompensa."

